<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jelly Cat Drop · 流体猫猫叠叠乐</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff5d8f;--violet:#7c5cff;--cyan:#37d5ff;--gold:#ffc93c}
html,body{height:100%;overflow:hidden;background:#17122b;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none;touch-action:none}
body{background:radial-gradient(900px 600px at 20% -10%,#4b2a85 0,transparent 60%),radial-gradient(800px 500px at 110% 10%,#123a6b 0,transparent 55%),linear-gradient(180deg,#241645,#120d24)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
header{width:min(96vw,460px);display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5}
.logo{font-weight:900;letter-spacing:.5px;font-size:19px;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo small{display:block;font-size:10px;color:#ffd6e7;letter-spacing:3px}
.pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);border-radius:999px;padding:7px 12px;font-size:12px;text-align:center;min-width:76px}
.pill b{display:block;font-size:17px}
#stageWrap{position:relative;width:min(96vw,460px);flex:1;min-height:0;margin-top:10px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.25);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);will-change:transform}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:4}
.nextBox{background:rgba(15,10,35,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);border-radius:16px;padding:6px 10px;font-size:11px;display:flex;align-items:center;gap:8px}
.nextBox img{width:34px;height:34px}
.combo{font-weight:900;color:var(--gold);text-shadow:0 2px 10px rgba(255,201,60,.8);font-size:18px;opacity:0;transform:scale(.7);transition:.15s}
.combo.show{opacity:1;transform:scale(1.15)}
.tip{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.75);pointer-events:none;z-index:3}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(16,10,34,.62);backdrop-filter:blur(12px);transition:opacity .35s,visibility .35s}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
h1.title{font-size:42px;line-height:1;font-weight:1000;background:linear-gradient(90deg,#ffd6e7,#ffc93c,#37d5ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.sub{color:#e9e4ff;font-size:14px;line-height:1.7;max-width:330px}
.btn{border:0;cursor:pointer;color:#24102e;font-weight:1000;border-radius:999px;padding:15px 26px;font-size:17px;background:linear-gradient(90deg,#ffd93c,#ff5d8f);box-shadow:0 10px 28px rgba(255,93,143,.45),inset 0 2px 0 #fff8;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.share{background:linear-gradient(90deg,#37d5ff,#7c5cff,#ff5d8f);color:#fff;animation:breathe 1.1s infinite}
.btn.ad{background:linear-gradient(90deg,#ffe259,#ffa751);opacity:0;transform:translateY(18px);pointer-events:none;transition:.45s}
.btn.ad.show{opacity:1;transform:none;pointer-events:auto}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.25)}}
.catsRow{display:flex;align-items:flex-end;gap:2px}.catsRow img{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.scoreBig{font-size:52px;font-weight:1000;color:var(--gold);line-height:1}
.rank{font-size:21px;font-weight:1000;color:#ffd6e7}
.roast{color:#e9e4ff;font-size:14px;line-height:1.6;max-width:340px}
#poster{width:min(72vw,280px);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:none}
#adOverlay{z-index:50;background:#000}
.adCount{font-size:72px;font-weight:1000}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:rgba(0,0,0,.75);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.evo{width:min(94vw,460px);display:flex;align-items:center;gap:3px;justify-content:center;margin-top:8px;opacity:.92}
.evo img{width:clamp(18px,5.4vw,34px);height:auto}
.evo span{font-size:10px;color:#fff9}
@media(max-height:650px){h1.title{font-size:32px}.catsRow{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">JELLY CAT DROP<small>流体猫猫叠叠乐</small></div>
    <div class="pill">分数<b id="score">0</b></div>
    <div class="pill">最佳<b id="best">0</b></div>
    <div class="pill">最大猫<b id="maxCat">Lv.1</b></div>
  </header>

  <div id="stageWrap">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="nextBox">下一只<br><img id="nextImg" alt="next"><span id="queueImg"></span></div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="tip">移动瞄准 · 点击 / 松手投放 · 两只相同猫咪合体进化！</div>

    <div class="overlay" id="startScreen">
      <h1 class="title">JELLY CAT<br>DROP</h1>
      <div class="catsRow" id="catsRow"></div>
      <p class="sub">投放果冻猫，两只相同猫咪碰撞就会合体进化！<br>从小粉猫一路合成到 <b style="color:#ffc93c">Lv.11 宇宙喵神</b>，别让猫咪堆过红线！</p>
      <button class="btn" id="startBtn">▶ 开始叠猫猫</button>
      <p class="sub" style="font-size:12px;opacity:.75">纯前端单文件 · 程序化绘制 11 级猫咪 · 无需下载任何素材</p>
    </div>

    <div class="overlay hidden" id="overScreen">
      <div style="font-size:13px;letter-spacing:4px;color:#ffc93c">GAME OVER</div>
      <div class="scoreBig" id="finalScore">0</div>
      <div class="rank" id="rankTitle"></div>
      <p class="roast" id="rankRoast"></p>
      <img id="poster" alt="战绩海报">
      <button class="btn share" id="shareBtn">⚡ 炫耀我的猫猫帝国 ⚡</button>
      <button class="btn ad" id="adBtn">📺 看视频，用天基武器炸毁顶部 3 只猫猫继续！</button>
      <button class="btn" id="retryBtn">🔄 再来一局</button>
    </div>

    <div class="overlay hidden" id="adOverlay">
      <div style="font-size:14px;letter-spacing:3px">模拟广告播放中…</div>
      <div class="adCount" id="adCount">3</div>
      <p class="sub">天基武器正在充能，请稍候 ☄️</p>
    </div>
  </div>
  <div class="evo" id="evoBar"></div>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const {Engine, Bodies, Body, Composite, Events} = Matter;

// ---------- 基础配置：原始半径按画布宽度等比缩放，保证 Lv11 也能入场 ----------
const SPEC_R = [20,32,45,60,80,105,135,170,210,260,320];
const COLORS = ['#FFB6C1','#ADD8E6','#F5DEB3','#FF9F68','#2F4F4F','#FFFFFF','#FFA500','#32CD32','#C0392B','#FFD700','#4B0082'];
const NAMES = ['小粉猫','纸箱猫','吐司猫','三花猫','墨镜猫','宇航员猫','橘胖猫','史莱姆猫','肌肉猫','金身猫','宇宙喵神'];
const SCORES = [1,3,6,10,15,21,28,36,45,55,100];

const wrap = document.getElementById('stageWrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, scaleK = 1, RADII = SPEC_R.slice();
function computeSize(){
  const r = wrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(300, r.width); H = Math.max(380, r.height);
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scaleK = Math.min(W / 700, 1) * 1.55; // 460宽时约1.02，Lv11半径≈326→实际用封顶
  RADII = SPEC_R.map(r0 => Math.min(r0 * scaleK, W * 0.42));
}
computeSize();

// ---------- CHAPTER 2: 程序化美术 generateCatTexture(level) ----------
function generateCatTexture(level){
  const r = SPEC_R[level-1], s = r*2 + 36, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d'), cx = s/2, cy = s/2, col = COLORS[level-1];
  g.translate(cx,cy);
  if(level===10){ g.shadowColor='#FFD700'; g.shadowBlur=34; }
  if(level===6){ g.beginPath(); g.arc(0,0,r+13,0,7); g.fillStyle='rgba(140,210,255,.28)'; g.fill(); g.lineWidth=5; g.strokeStyle='rgba(190,235,255,.8)'; g.stroke(); }
  // 猫耳（二次贝塞尔）
  g.fillStyle = col; g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=3;
  for(const dir of [-1,1]){
    g.beginPath();
    g.moveTo(dir*r*.62,-r*.55);
    g.quadraticCurveTo(dir*r*.95,-r*1.18, dir*r*.28,-r*.88);
    g.quadraticCurveTo(dir*r*.12,-r*.68, dir*r*.34,-r*.50);
    g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.fillStyle='rgba(255,120,160,.55)';
    g.moveTo(dir*r*.60,-r*.66); g.quadraticCurveTo(dir*r*.76,-r*.94, dir*r*.40,-r*.80); g.quadraticCurveTo(dir*r*.34,-r*.66, dir*r*.46,-r*.58); g.fill();
    g.fillStyle = col;
  }
  // 主体（Lv8 波浪史莱姆边缘）
  g.beginPath();
  if(level===8){
    for(let a=0;a<=Math.PI*2+0.01;a+=0.08){ const rr=r+Math.sin(a*9)*7; const x=Math.cos(a)*rr,y=Math.sin(a)*rr; a===0?g.moveTo(x,y):g.lineTo(x,y); }
    g.closePath();
  } else g.arc(0,0,r,0,7);
  g.fillStyle=col; g.fill(); g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.20)'; g.stroke();
  // Fake 3D Rim Light + 高光
  g.beginPath(); g.arc(0,0,r-5,Math.PI*1.05,Math.PI*1.55); g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=Math.max(3,r*.09); g.stroke();
  g.beginPath(); g.ellipse(-r*.38,-r*.45,r*.20,r*.12,-0.6,0,7); g.fillStyle='rgba(255,255,255,.45)'; g.fill();
  if(level===11){ g.save(); g.beginPath(); g.arc(0,0,r-3,0,7); g.clip();
    for(let i=0;i<70;i++){ g.fillStyle=`rgba(255,255,255,${.35+Math.random()*.65})`; const px=(Math.random()*2-1)*r, py=(Math.random()*2-1)*r; g.fillRect(px,py,2.4,2.4); } g.restore(); }
  if(level===3){ g.beginPath(); g.arc(0,0,r-8,0,7); g.lineWidth=14; g.strokeStyle='#B5651D'; g.stroke(); }
  if(level===4){ g.beginPath(); g.arc(-r*.45,-r*.2,r*.42,-.4,1.6); g.fillStyle='#fff'; g.fill(); g.beginPath(); g.arc(r*.5,r*.35,r*.34,0,7); g.fillStyle='#333'; g.fill(); }
  if(level===2){ g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(-r*.62,-r*.55,r*1.24,r*1.2); g.strokeStyle='#8a6d3b'; g.strokeRect(-r*.62,-r*.55,r*1.24,r*1.2); }
  if(level===9){ for(const dir of [-1,1]){ g.beginPath(); g.ellipse(dir*(r+14),10,20,34,dir*.5,0,7); g.fillStyle='#C0392B'; g.fill(); g.stroke(); g.beginPath(); g.arc(dir*(r+20),-18,13,0,7); g.fillStyle='#E74C3C'; g.fill(); } }
  if(level===7){ g.beginPath(); g.arc(0,r*.42,r*.55,.15*Math.PI,.85*Math.PI); g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=4; g.stroke();
    g.save(); g.translate(r*.25,r*.05); g.rotate(.15); g.strokeStyle='#fff'; g.lineWidth=5; g.beginPath(); g.moveTo(-24,0); g.lineTo(24,0); g.stroke(); g.beginPath(); g.moveTo(10,-10); g.lineTo(22,0); g.lineTo(10,10); g.stroke(); g.restore(); }
  // 五官
  const ink = level===5||level===11 ? '#fff' : '#263238';
  g.fillStyle=ink; g.strokeStyle=ink; g.lineCap='round';
  const eye=(x,y,rr)=>{g.beginPath();g.arc(x,y,rr,0,7);g.fill();};
  if(level===1){ eye(-r*.32,-r*.05,4); eye(r*.32,-r*.05,4); g.fillStyle='rgba(255,90,130,.55)'; g.beginPath(); g.arc(-r*.55,r*.18,9,0,7); g.arc(r*.55,r*.18,9,0,7); g.fill(); g.strokeStyle=ink; g.lineWidth=3; g.beginPath(); g.arc(0,r*.16,7,.15*Math.PI,.85*Math.PI); g.stroke(); }
  else if(level===2){ g.lineWidth=4; for(const dir of [-1,1]){ g.beginPath(); g.moveTo(dir*r*.38-10,-r*.05); g.lineTo(dir*r*.38+10,-r*.05); g.stroke(); } g.beginPath(); g.arc(0,r*.2,6,0,Math.PI); g.stroke(); }
  else if(level===4){ g.lineWidth=6; for(const dir of [-1,1]){ g.beginPath(); g.moveTo(dir*r*.12,-r*.38); g.lineTo(dir*r*.48,-r*.18); g.stroke(); eye(dir*r*.3,-r*.02,5);} g.beginPath(); g.moveTo(-8,r*.28); g.lineTo(0,r*.16); g.lineTo(8,r*.28); g.stroke(); }
  else if(level===5){ g.fillStyle='#111'; g.fillRect(-r*.72,-r*.28,r*1.44,r*.34); g.fillStyle='rgba(0,255,220,.85)'; g.fillRect(-r*.55,-r*.18,r*.38,5); g.fillRect(r*.17,-r*.18,r*.38,5); }
  else if(level===6){ eye(-r*.3,-r*.1,r*.09); eye(r*.3,-r*.1,r*.09); g.fillStyle='#fff'; eye(-r*.27,-r*.14,3); eye(r*.33,-r*.14,3); g.beginPath(); g.ellipse(0,r*.24,10,14,0,0,7); g.fillStyle='#263238'; g.fill(); }
  else if(level===10){ g.lineWidth=5; for(const dir of [-1,1]){ g.beginPath(); g.arc(dir*r*.32,-r*.05,r*.14,.1*Math.PI,.9*Math.PI); g.stroke(); } g.beginPath(); g.arc(0,r*.18,r*.16,.15*Math.PI,.85*Math.PI); g.stroke(); }
  else if(level===11){ g.shadowColor='#fff'; g.shadowBlur=16; eye(-r*.3,-r*.08,r*.07); eye(r*.3,-r*.08,r*.07); g.lineWidth=5; g.beginPath(); g.arc(0,r*.14,r*.18,.15*Math.PI,.85*Math.PI); g.stroke(); g.shadowBlur=0; }
  else { eye(-r*.3,-r*.06,r*.07); eye(r*.3,-r*.06,r*.07); g.lineWidth=4; g.beginPath(); g.arc(0,r*.15,r*.15,.15*Math.PI,.85*Math.PI); g.stroke(); }
  return c.toDataURL('image/png');
}
const TEXTURES = [], IMAGES = [];
for(let lv=1; lv<=11; lv++){ const url=generateCatTexture(lv); TEXTURES.push(url); const im=new Image(); im.src=url; IMAGES.push(im); }
document.getElementById('catsRow').innerHTML = [1,3,5,7,9,11].map((lv,i)=>`<img src="${TEXTURES[lv-1]}" width="${34+i*7}">`).join('');
document.getElementById('evoBar').innerHTML = TEXTURES.map((t,i)=>`${i?'<span>›</span>':''}<img src="${t}" title="Lv.${i+1} ${NAMES[i]}">`).join('');

// ---------- CHAPTER 4: 粒子系统 ----------
class ParticleSystem{
  constructor(){ this.list=[]; }
  burst(x,y,color,n=22,power=1){
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(1+Math.random()*4.2)*power;
      this.list.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,decay:.014+Math.random()*.02,size:3+Math.random()*7,color,star:Math.random()<.25}); }
  }
  updateDraw(g){
    this.list=this.list.filter(p=>p.life>0);
    for(const p of this.list){ p.life-=p.decay; p.x+=p.vx; p.y+=p.vy; p.vy+=.09; p.vx*=.985;
      const t=Math.max(p.life,0), fade=t<.5 ? Math.pow(t*2,2) : 1; // 后50%指数衰减
      g.save(); g.globalAlpha=fade; g.fillStyle=p.color; g.translate(p.x,p.y);
      const s=p.size*fade; if(p.star){ g.beginPath(); for(let i=0;i<5;i++){ const a=i/5*Math.PI*2-Math.PI/2; g[i?'lineTo':'moveTo'](Math.cos(a)*s,Math.sin(a)*s); const a2=a+Math.PI/5; g.lineTo(Math.cos(a2)*s*.45,Math.sin(a2)*s*.45);} g.fill(); }
      else { g.beginPath(); g.arc(0,0,Math.max(s,0.1),0,7); g.fill(); } g.restore(); }
  }
}
const particles = new ParticleSystem();

// ---------- FSM + 游戏状态 ----------
const STATE={INIT:'STATE_INIT',PLAYING:'STATE_PLAYING',OVER:'STATE_GAMEOVER'};
let state=STATE.INIT, score=0, best=+(localStorage.getItem('jcd_best')||0), maxLevel=1;
let engine, world, current=null, nextLevel=1, queueLevel=1, dropX=0, canDrop=true, dangerTimer=0, trauma=0, combo=0, comboTimer=0, shakeT=0;
document.getElementById('best').textContent=best;
const randLevel=()=>{ const pool=[1,1,1,2,2,3]; return pool[(Math.random()*pool.length)|0]; };
const $=id=>document.getElementById(id);
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

function initPhysics(){
  if(engine){ Matter.Engine.clear(engine); }
  engine=Engine.create(); world=engine.world; engine.gravity.y=1.6;
  const opts={isStatic:true, friction:1, render:{visible:false}};
  const floor=Bodies.rectangle(W/2,H+30,W+200,60,opts);
  const left=Bodies.rectangle(-24,H/2,48,H*2,opts), right=Bodies.rectangle(W+24,H/2,48,H*2,opts);
  Composite.add(world,[floor,left,right]);
  Events.on(engine,'collisionStart',onCollide);
}
function makeCat(level,x,y,isNew=false){
  const r=RADII[level-1];
  const b=Bodies.circle(x,y,r,{
    restitution:.45, friction:.8, frictionAir:.008, slop:.05,
    density:.001*Math.pow(1.2,level), label:'cat_'+level
  });
  b.plugin={level, born:performance.now(), squash:0, prevVy:0, img:IMAGES[level-1], r};
  if(isNew) Body.setVelocity(b,{x:0,y:2});
  Composite.add(world,b); return b;
}
function cats(){ return Composite.allBodies(world).filter(b=>b.label.startsWith('cat_')); }

function onCollide(ev){
  if(state!==STATE.PLAYING) return;
  for(const pair of ev.pairs){
    const a=pair.bodyA,b=pair.bodyB;
    if(!a.label.startsWith('cat_')||a.label!==b.label) { squashOnHit(a); squashOnHit(b); continue; }
    if(a.plugin.merged||b.plugin.merged) continue;
    const lv=a.plugin.level; squashOnHit(a); squashOnHit(b);
    if(lv>=11) continue;
    a.plugin.merged=b.plugin.merged=true;
    const x=(a.position.x+b.position.x)/2, y=(a.position.y+b.position.y)/2;
    Composite.remove(world,a); Composite.remove(world,b);
    const nb=makeCat(lv+1,x,y);
    // 防卡死冲量：按新物体质量缩放，各等级弹跳一致（原型 -0.1 固定力对大猫无效，已实测修正）
    Body.applyForce(nb, nb.position, {x:(Math.random()-.5)*.008*nb.mass, y:-.015*nb.mass});
    combo++; comboTimer=110; score+=SCORES[lv]; maxLevel=Math.max(maxLevel,lv+1);
    particles.burst(x,y,COLORS[lv], lv>=5?30:18, 1+lv*.12);
    if(lv+1>=5) trauma=Math.min(1, trauma+.35+(lv+1)*.05);
    if(lv+1===11){ trauma=1; shakeT=60; toast('🎉 宇宙喵神诞生！！'); }
    const ce=$('combo'); if(combo>1){ ce.textContent='COMBO ×'+combo+' 🔥'; ce.classList.add('show'); }
    updateHUD();
  }
}
function squashOnHit(b){ if(b.label&&b.label.startsWith('cat_') && Math.abs(b.velocity.y)>3) b.plugin.squash=1; }

function updateHUD(){ $('score').textContent=score; $('maxCat').textContent='Lv.'+maxLevel+' '+NAMES[maxLevel-1];
  $('nextImg').src=TEXTURES[nextLevel-1]; $('nextImg').title=NAMES[nextLevel-1]; }

function drop(){
  if(state!==STATE.PLAYING||!canDrop||!current) return;
  const lv=current; makeCat(lv, dropX, 64);
  current=nextLevel; nextLevel=queueLevel; queueLevel=randLevel(); canDrop=false;
  setTimeout(()=>{canDrop=true;},420); updateHUD();
}
function startGame(){
  initPhysics(); score=0; maxLevel=1; combo=0; dangerTimer=0; trauma=0;
  nextLevel=randLevel(); queueLevel=randLevel(); current=randLevel(); dropX=W/2; canDrop=true;
  state=STATE.PLAYING; $('startScreen').classList.add('hidden'); $('overScreen').classList.add('hidden'); updateHUD();
}
const TITLES=[[3,'【纯种大怨种 / 见习铲屎官】','你就只配给猫主子铲屎！'],[6,'【冷酷无情的自动喂粮机】','你的手速甚至不如楼下瘫痪的老奶奶。'],[9,'【猫界海王 · 引力波操纵者】','你已经摸到了果冻猫咪的灵魂壁垒！'],[11,'【神级猫奴 · 喵星降临降维打击者】','人类的骄傲！爱因斯坦看了都要给你点烟！']];
function gameOver(){
  state=STATE.OVER; best=Math.max(best,score); localStorage.setItem('jcd_best',best); $('best').textContent=best;
  const t=TITLES.find(x=>maxLevel<=x[0]);
  $('finalScore').textContent=score; $('rankTitle').textContent=t[1]; $('rankRoast').textContent=t[2];
  $('poster').style.display='none'; $('adBtn').classList.remove('show');
  $('overScreen').classList.remove('hidden');
  setTimeout(()=>{ if(state===STATE.OVER) $('adBtn').classList.add('show'); },2000);
}
function makePoster(){
  const c=document.createElement('canvas'); c.width=600; c.height=760; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,600,760); gr.addColorStop(0,'#3b1d78'); gr.addColorStop(1,'#ff5d8f'); g.fillStyle=gr; g.fillRect(0,0,600,760);
  g.fillStyle='#fff'; g.textAlign='center'; g.font='900 44px sans-serif'; g.fillText('JELLY CAT DROP',300,80);
  g.font='700 26px sans-serif'; g.fillText('我的猫猫帝国战绩',300,125);
  const img=IMAGES[maxLevel-1]; if(img.complete) g.drawImage(img,170,150,260,260);
  g.fillStyle='#FFD93C'; g.font='1000 72px sans-serif'; g.fillText(score+' 分',300,490);
  const t=TITLES.find(x=>maxLevel<=x[0]); g.fillStyle='#fff'; g.font='900 27px sans-serif';
  g.fillText(t[1],300,545); g.font='20px sans-serif'; g.fillText(t[2],300,585);
  g.fillText('最高合成：Lv.'+maxLevel+' '+NAMES[maxLevel-1],300,630);
  g.font='900 24px sans-serif'; g.fillText('长按保存图片发朋友圈，不服来战！',300,700);
  const p=$('poster'); p.src=c.toDataURL('image/png'); p.style.display='block'; toast('海报已生成，长按保存发朋友圈！');
}
async function mockShowAd(){
  $('adOverlay').classList.remove('hidden');
  for(let i=3;i>0;i--){ $('adCount').textContent=i; await new Promise(r=>setTimeout(r,1000)); }
  $('adOverlay').classList.add('hidden');
  const top=cats().sort((a,b)=>a.position.y-b.position.y).slice(0,3);
  top.forEach(b=>{ particles.burst(b.position.x,b.position.y,COLORS[b.plugin.level-1],26,1.6); Composite.remove(world,b); });
  trauma=1; dangerTimer=0; state=STATE.PLAYING; $('overScreen').classList.add('hidden'); toast('💥 天基武器已炸毁顶部 3 只猫猫，继续战斗！');
}

// ---------- 输入 ----------
function setX(e){ const r=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const rad=current?RADII[current-1]:20; dropX=Math.max(rad,Math.min(W-rad,x)); }
wrap.addEventListener('pointermove',setX); wrap.addEventListener('touchmove',setX,{passive:true});
wrap.addEventListener('pointerdown',e=>{ setX(e); });
wrap.addEventListener('pointerup',e=>{ if(e.target.closest('button')||e.target.closest('.overlay'))return; setX(e); drop(); });
$('startBtn').onclick=startGame; $('retryBtn').onclick=startGame;
$('shareBtn').onclick=makePoster; $('adBtn').onclick=mockShowAd;
window.addEventListener('resize',()=>{ const old=engine; computeSize(); if(state!==STATE.INIT) startGame(); });

// ---------- 主循环：物理/渲染分离，自定义渲染实现 Squash & Stretch ----------
let last=performance.now(), acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(now-last,50); last=now;
  if(state===STATE.PLAYING && engine){
    acc+=dt; while(acc>=1000/60){ Matter.Engine.update(engine,1000/60); acc-=1000/60; }
    // 危险线判定：顶部15%，静止猫越线累计3秒
    const lineY=H*.15; const danger=cats().some(b=>b.position.y-b.plugin.r<lineY && Math.hypot(b.velocity.x,b.velocity.y)<.45 && now-b.plugin.born>1200);
    dangerTimer = danger ? dangerTimer+dt : Math.max(0,dangerTimer-dt*2);
    if(dangerTimer>=3000) gameOver();
    if(comboTimer>0){ comboTimer--; if(comboTimer===0){ combo=0; $('combo').classList.remove('show'); } }
  }
  // Trauma 震动
  if(shakeT>0) shakeT--;
  trauma=Math.max(0,trauma-.012);
  const sh=(trauma*trauma)*(shakeT>0?22:12), sx=(Math.random()*2-1)*sh, sy=(Math.random()*2-1)*sh;
  wrap.style.transform=`translate(${sx}px,${sy}px) rotate(${(Math.random()*2-1)*trauma*1.2}deg)`;
  draw(now);
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#2b1c55'); bg.addColorStop(1,'#150f2e'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 危险红线（顶部15%）
  const lineY=H*.15, flash=dangerTimer>0 && ((now/120)|0)%2===0;
  ctx.save(); ctx.setLineDash([12,9]); ctx.lineWidth=flash?5:3; ctx.strokeStyle=dangerTimer>0?'#ff1744':'rgba(255,80,110,.65)';
  ctx.beginPath(); ctx.moveTo(8,lineY); ctx.lineTo(W-8,lineY); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=ctx.strokeStyle; ctx.font='700 12px sans-serif'; ctx.fillText(dangerTimer>0?`⚠ 危险 ${(Math.max(0,3-dangerTimer/1000)).toFixed(1)}s`:'⚠ 危险线',10,lineY-8); ctx.restore();
  // 投放预览
  if(state===STATE.PLAYING&&current){
    ctx.save(); ctx.setLineDash([4,8]); ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(dropX,54); ctx.lineTo(dropX,H); ctx.stroke(); ctx.restore();
    const im=IMAGES[current-1], r=RADII[current-1]; if(im.complete) ctx.drawImage(im,dropX-r,54-r,r*2,r*2);
  }
  // 猫咪（Squash & Stretch：落地速度突变触发 200ms 压扁回弹）
  if(engine) for(const b of cats()){
    const p=b.plugin, vy=b.velocity.y;
    if(Math.abs(vy-p.prevVy)>4) p.squash=1; p.prevVy=vy; if(p.squash>0)p.squash=Math.max(0,p.squash-dtSquash());
    const s=p.squash, sx=1+.28*s, sy=1-.28*s, r=p.r;
    ctx.save(); ctx.translate(b.position.x,b.position.y); ctx.rotate(b.angle); ctx.scale(sx,sy);
    if(p.img.complete) ctx.drawImage(p.img,-r,-r,r*2,r*2); else { ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fillStyle=COLORS[p.level-1]; ctx.fill(); }
    ctx.restore();
  }
  particles.updateDraw(ctx);
}
let _prevT=performance.now(); function dtSquash(){ const n=performance.now(), d=Math.min((n-_prevT)/200,0.2); _prevT=n; return Math.max(d,0.016); }
initPhysics(); updateHUD();
requestAnimationFrame(frame);
})();
</script>
